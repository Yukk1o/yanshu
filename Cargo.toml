[workspace]
resolver = "3"
members = [
  "rust/crates/yanshu-diagnostic",
  "rust/crates/yanshu-syntax",
  "rust/crates/yanshu-format",
  "rust/crates/yanshu-lsp",
  "rust/crates/yanshu-mcp",
  "rust/crates/yanshu-runtime",
  "rust/crates/yanshu-analysis",
  "rust/crates/yanshu-compiler",
  "rust/crates/yanshu-library",
  "rust/crates/yanshu-bundle",
  "rust/crates/yanshu-package",
  "rust/crates/yanshu-conformance",
  "rust/crates/yanshu-store",
  "rust/crates/yanshu-service",
  "rust/crates/yanshu-http",
  "rust/crates/yanshu-ops",
  "rust/crates/yanshu-rollout",
  "rust/crates/yanshu-server",
  "rust/crates/yanshu-provider",
  "rust/crates/yanshu-cli",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = { version = "=0.11.0", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "=1.11.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["http1", "server-graceful", "service", "tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false }
subtle = { version = "=2.6.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
strip = "symbols"
