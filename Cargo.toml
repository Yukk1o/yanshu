[workspace]
resolver = "3"
members = [
  "rust/crates/ail-diagnostic",
  "rust/crates/ail-syntax",
  "rust/crates/ail-runtime",
  "rust/crates/ail-conformance",
  "rust/crates/ail-store",
  "rust/crates/ail-service",
  "rust/crates/ail-http",
  "rust/crates/ail-server",
  "rust/crates/ail-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = { version = "=0.11.0", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
