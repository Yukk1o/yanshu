[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unlicense",
  "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
