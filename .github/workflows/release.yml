name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE-*"
      - "README.md"
      - "editors/vscode/**"
      - "rust/**"
      - "scripts/assemble-release.mjs"
      - "scripts/build-release.mjs"
      - "scripts/normalize-sbom.mjs"
      - "scripts/normalize-extension-sbom.mjs"
      - "scripts/release-lib.mjs"
      - "scripts/release-metadata.mjs"
      - "scripts/release.test.mjs"
      - "scripts/verify-release.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  metadata:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.release.outputs.rust_version }}
      rust_toolchain: ${{ steps.release.outputs.rust_toolchain }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Test deterministic release tooling
        run: node --test scripts/release.test.mjs

      - name: Resolve workspace release identity
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $arguments = @(
            "scripts/release-metadata.mjs",
            "--output", ".runtime/release-metadata.json",
            "--github-output", $env:GITHUB_OUTPUT
          )
          if ($env:RELEASE_TAG.Length -gt 0) {
            $arguments += @("--tag", $env:RELEASE_TAG)
          }
          node @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require an annotated tag on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $objectType = git cat-file -t $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0 -or $objectType -ne "tag") {
            throw "release tags must be annotated Git tag objects"
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "release tag must point to a commit contained in origin/main"
          }

  build:
    name: Reproducible CLI (${{ matrix.target }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
          node-version: 22

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ needs.metadata.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install and audit locked extension dependencies
        working-directory: editors/vscode
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm audit --registry=https://registry.npmjs.org --audit-level=high
          npm run check

      - name: Build all tools and VSIX twice and package deterministic archive
        run: >-
          node scripts/build-release.mjs
          --target ${{ matrix.target }}
          --out-dir .runtime/release
          --version ${{ needs.metadata.outputs.version }}
          --source-commit ${{ needs.metadata.outputs.source_commit }}
          --source-date-epoch ${{ needs.metadata.outputs.source_date_epoch }}

      - name: Upload platform release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: .runtime/release/*
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: CycloneDX SBOM
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ needs.metadata.outputs.rust_toolchain }}

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-sbom

      - name: Install cargo-cyclonedx 0.5.9
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate and normalize CycloneDX 1.5 SBOMs
        shell: pwsh
        run: |
          $programs = @(
            @{
              Key = "cli"
              Generated = "rust/crates/yanshu-cli/yanshu_bin.cdx.json"
            },
            @{
              Key = "mcp"
              Generated = "rust/crates/yanshu-mcp/yanshu-mcp_bin.cdx.json"
            },
            @{
              Key = "lsp"
              Generated = "rust/crates/yanshu-lsp/yanshu-lsp_bin.cdx.json"
            }
          )
          cargo cyclonedx `
            --manifest-path rust/crates/yanshu-cli/Cargo.toml `
            --format json `
            --describe binaries `
            --target all `
            --spec-version 1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($program in $programs) {
            if (-not (Test-Path -LiteralPath $program.Generated -PathType Leaf)) {
              throw "cargo-cyclonedx did not generate the expected $($program.Key) SBOM"
            }
            node scripts/normalize-sbom.mjs `
              --input $program.Generated `
              --output ".runtime/release/yanshu-v${{ needs.metadata.outputs.version }}-$($program.Key).cdx.json" `
              --program $program.Key `
              --version "${{ needs.metadata.outputs.version }}" `
              --source-commit "${{ needs.metadata.outputs.source_commit }}" `
              --source-date-epoch "${{ needs.metadata.outputs.source_date_epoch }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $rawExtension = Join-Path $PWD ".runtime/sbom-work/vscode.cdx.json"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $rawExtension) | Out-Null
          Push-Location editors/vscode
          try {
            $extensionSbom = npm sbom --package-lock-only --omit=dev --sbom-format=cyclonedx --sbom-type=application
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          [System.IO.File]::WriteAllText(
            $rawExtension,
            (($extensionSbom -join [Environment]::NewLine) + [Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false)
          )
          node scripts/normalize-extension-sbom.mjs --input $rawExtension --output ".runtime/release/yanshu-v${{ needs.metadata.outputs.version }}-vscode.cdx.json" --version "${{ needs.metadata.outputs.version }}" --source-commit "${{ needs.metadata.outputs.source_commit }}" --source-date-epoch "${{ needs.metadata.outputs.source_date_epoch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: .runtime/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - metadata
      - build
      - sbom
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download platform evidence and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: .runtime/release-input
          merge-multiple: true

      - name: Assemble and verify the immutable release set
        run: >-
          node scripts/assemble-release.mjs
          --input-dir .runtime/release-input
          --output-dir .runtime/release-final
          --version ${{ needs.metadata.outputs.version }}
          --source-commit ${{ needs.metadata.outputs.source_commit }}
          --source-date-epoch ${{ needs.metadata.outputs.source_date_epoch }}

      - name: Verify checksums and release manifest
        run: node scripts/verify-release.mjs .runtime/release-final

      - name: Generate keyless build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .runtime/release-final/*

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath .runtime/release-final -File |
              Sort-Object Name |
              ForEach-Object FullName
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title "Yanshu $env:GITHUB_REF_NAME" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
